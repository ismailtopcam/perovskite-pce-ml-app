# Tema: "Kafes" tasarım dili (Claude Design kanvası "Tez Uygulaması Yeniden Tasarım", 2026-11).
# Lacivert ray #0E1A2B · zemin #F4F5F7 · kart #FFFFFF · mavi #1F4FD1 = dürüst ölçüm / destekli ·
# turuncu #D9530F (metin #B84308) = sızıntı / iyimserlik / uyarı · Inter + Space Grotesk + JetBrains Mono.
# Renk rampaları ve bileşen CSS'i lib/ui.py içindedir.

[theme]
base = "light"
primaryColor = "#1F4FD1"
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1A2B"
linkColor = "#1F4FD1"
linkUnderline = false
borderColor = "#DCE0E6"
dataframeBorderColor = "#DCE0E6"
dataframeHeaderBackgroundColor = "#F7F8FA"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "10px"
baseFontSize = 15
font = "Inter, system-ui, sans-serif"
headingFont = "'Space Grotesk', Inter, system-ui, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFont = "'JetBrains Mono', ui-monospace, Consolas, monospace"
codeFontSize = "0.85rem"
codeBackgroundColor = "#EEF1F5"
codeTextColor = "#0E1A2B"
metricValueFontSize = "2.2rem"
metricValueFontWeight = 600
chartCategoricalColors = ["#1E3150", "#1F4FD1", "#D9530F", "#8C97A6", "#7FA0F0", "#F4A26B"]
# Uyarı kutuları: turuncu = uyarı, mavi = bilgi, nötr = gri
redBackgroundColor = "#FCEBDF"
redTextColor = "#8F3406"
orangeBackgroundColor = "#FCEBDF"
orangeTextColor = "#8F3406"
yellowBackgroundColor = "#FCEBDF"
yellowTextColor = "#8F3406"
blueBackgroundColor = "#E6ECFB"
blueTextColor = "#163BA0"
greenBackgroundColor = "#E6ECFB"
greenTextColor = "#163BA0"
grayBackgroundColor = "#EEF1F5"
grayTextColor = "#33435A"

[theme.sidebar]
backgroundColor = "#0E1A2B"
secondaryBackgroundColor = "#1E3150"
textColor = "#E7ECF3"
linkColor = "#FF9A5C"
borderColor = "#22324A"
codeBackgroundColor = "#1E3150"
headingFontSizes = ["1.6rem", "1.2rem", "1rem", "0.9rem", "0.8rem", "0.7rem"]

# Yazı tipleri — üçü de SIL OFL 1.1 (lisanslar static/fonts/LICENSE-*-OFL.txt); uygulamayla birlikte
# sunulur, dış istek yapılmaz. Kaynak: Fontsource değişken sürümleri 5.3.0 (latin + latin-ext alt kümeleri).
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

