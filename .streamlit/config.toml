# Tema: "Modernist" tasarım sistemi (Claude Design projesi "Tez Uygulamasi (Modernist)").
# Mürekkep #201e1d · zemin #f3f2f2 · vurgu kırmızı #ec3013 · köşe yarıçapı 0 · Archivo.
# Renk rampaları (nötr/vurgu) ve bileşen CSS'i lib/ui.py içindedir.

[theme]
base = "light"
primaryColor = "#ec3013"
backgroundColor = "#f3f2f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#201e1d"
linkColor = "#ae1800"
linkUnderline = false
borderColor = "#9f9d9d"
dataframeBorderColor = "#9f9d9d"
dataframeHeaderBackgroundColor = "#eae7e7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
baseFontSize = 15
font = "Archivo, system-ui, sans-serif"
headingFont = "Archivo, system-ui, sans-serif"
headingFontWeights = [800, 800, 800, 800, 700, 700]
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
codeFontSize = "0.85rem"
codeBackgroundColor = "#eae7e7"
codeTextColor = "#201e1d"
metricValueFontSize = "2.4rem"
metricValueFontWeight = 800
chartCategoricalColors = ["#201e1d", "#ec3013", "#7d7979", "#ff9783", "#bab6b6", "#ae1800"]
# Uyarı kutuları: renkli Streamlit uyarıları yerine mürekkep/vurgu tonları
redBackgroundColor = "#fff2ef"
redTextColor = "#7c1405"
orangeBackgroundColor = "#fff2ef"
orangeTextColor = "#7c1405"
yellowBackgroundColor = "#fff2ef"
yellowTextColor = "#7c1405"
blueBackgroundColor = "#eae7e7"
blueTextColor = "#201e1d"
greenBackgroundColor = "#eae7e7"
greenTextColor = "#201e1d"
grayBackgroundColor = "#eae7e7"
grayTextColor = "#444141"

[theme.sidebar]
backgroundColor = "#f3f2f2"
secondaryBackgroundColor = "#eae7e7"
textColor = "#201e1d"
borderColor = "#9f9d9d"
headingFontSizes = ["1.9rem", "1.2rem", "1rem", "0.9rem", "0.8rem", "0.7rem"]

# Archivo — SIL OFL 1.1 (static/fonts/LICENSE-Archivo-OFL.txt); uygulamayla birlikte sunulur.
[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin-ext-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin-ext-wght-italic.woff2"
weight = "100 900"
style = "italic"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[server]
headless = true
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
